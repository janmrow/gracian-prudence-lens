name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".pre-commit-config.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check skills
        run: npm run check
